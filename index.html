<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f4f6">
  <title>Law Recall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">

    <section id="homeScreen" class="screen active">
      <div class="card home-card">
        <div class="book-icon" aria-hidden="true">📚</div>
        <h1>Law Recall</h1>
        <p class="subtitle">법규 답안 암기 Prototype</p>

        <button id="goSettingsBtn" class="primary-btn">시험 시작</button>
        <small>Prototype v0.2</small>
      </div>
    </section>

    <section id="settingsScreen" class="screen">
      <div class="card settings-card">
        <header class="screen-header">
          <button id="backBtn" class="icon-btn" aria-label="뒤로 가기">←</button>
          <div>
            <h2>시험 설정</h2>
            <p>시험할 범위를 선택하세요.</p>
          </div>
        </header>

        <form id="testForm">
          <fieldset>
            <legend>과목</legend>
            <div class="choice-grid subject-grid">
              <label><input type="radio" name="subject" value="행정법" checked><span>행정법</span></label>
              <label><input type="radio" name="subject" value="토지보상법"><span>토지보상법</span></label>
              <label><input type="radio" name="subject" value="부동산공시법"><span>부동산공시법</span></label>
              <label><input type="radio" name="subject" value="감정평가법"><span>감정평가법</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>논점 등급</legend>
            <div class="choice-grid grade-grid">
              <label><input type="checkbox" name="grade" value="A" checked><span>A</span></label>
              <label><input type="checkbox" name="grade" value="B" checked><span>B</span></label>
              <label><input type="checkbox" name="grade" value="C"><span>C</span></label>
              <label><input type="checkbox" name="grade" value="D"><span>D</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>시험 범위</legend>
            <div class="choice-grid range-grid">
              <label><input type="radio" name="range" value="1수준" checked><span>1수준</span></label>
              <label><input type="radio" name="range" value="2수준"><span>2수준</span></label>
              <label><input type="radio" name="range" value="3수준"><span>3수준</span></label>
              <label><input type="radio" name="range" value="4수준"><span>4수준</span></label>
              <label class="wide"><input type="radio" name="range" value="모든 내용"><span>모든 내용 · 줄글 포함</span></label>
            </div>
          </fieldset>

          <button type="submit" class="primary-btn start-test-btn">설정 완료</button>
        </form>
      </div>
    </section>

    <section id="previewScreen" class="screen">
      <div class="card preview-card">
        <div class="success-icon">✓</div>
        <h2>시험 설정 완료</h2>
        <p id="summaryText"></p>
        <button id="editSettingsBtn" class="secondary-btn">설정 다시 선택</button>
        <button id="nextStepBtn" class="primary-btn">다음 단계 준비 중</button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
