<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Law Recall v0.6</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Law Recall</h1>
        <p class="version">Prototype v0.6 · 채점 결과 저장</p>
      </div>
      <button id="homeBtn" class="ghost-button" type="button">처음으로</button>
    </header>

    <section id="homeScreen" class="screen active">
      <div class="card home-card">
        <h2>Law Recall</h2>
        <p class="home-copy">선택한 범위에서 논점을 무작위로 출제하고, 작성 후 목차와 줄글을 직접 O/X 채점합니다.</p>
        <button id="goSettingsBtn" class="primary-button large" type="button">시험 시작</button>
        <p id="storedCount" class="stored-count">저장된 채점 기록 0회</p>
      </div>
    </section>

    <section id="settingsScreen" class="screen">
      <div class="card">
        <h2>테스트 설정</h2>

        <div class="setting-block">
          <h3>과목</h3>
          <div class="option-grid" id="subjectOptions">
            <label><input type="checkbox" value="행정법" checked><span>행정법</span></label>
            <label><input type="checkbox" value="토지보상법"><span>토지보상법</span></label>
            <label><input type="checkbox" value="부동산공시법"><span>부동산공시법</span></label>
            <label><input type="checkbox" value="감정평가법"><span>감정평가법</span></label>
          </div>
        </div>

        <div class="setting-block">
          <h3>등급</h3>
          <div class="option-grid compact" id="gradeOptions">
            <label><input type="checkbox" value="A" checked><span>A</span></label>
            <label><input type="checkbox" value="B" checked><span>B</span></label>
            <label><input type="checkbox" value="C"><span>C</span></label>
            <label><input type="checkbox" value="D"><span>D</span></label>
          </div>
        </div>

        <div class="setting-block">
          <h3>테스트 범위</h3>
          <div class="option-grid range-grid">
            <label><input type="radio" name="range" value="목차 전체"><span>목차 전체</span></label>
            <label><input type="radio" name="range" value="모든 내용" checked><span>모든 내용</span></label>
          </div>
        </div>

        <p id="settingsError" class="error-text" aria-live="polite"></p>
        <button id="startBtn" class="primary-button large" type="button">테스트 시작</button>
      </div>
    </section>

    <section id="questionScreen" class="screen">
      <div class="topic-header card">
        <div class="topic-meta">
          <span id="subjectBadge" class="badge"></span>
          <span id="gradeBadge" class="badge muted"></span>
          <span id="rangeBadge" class="badge muted"></span>
        </div>
        <p id="chapterText" class="chapter-text"></p>
        <h2><span id="topicNumber"></span> <span id="topicTitle"></span></h2>
      </div>

      <div class="answer-layout" id="answerLayout">
        <section class="writing-panel card">
          <div class="panel-title-row">
            <h3>내 답안</h3>
            <span class="helper">답안은 저장되지 않습니다.</span>
          </div>
          <textarea id="userAnswer" placeholder="답안을 작성하세요"></textarea>
          <button id="revealBtn" class="primary-button" type="button">정답 보기</button>
        </section>

        <aside id="modelPanel" class="model-panel card" aria-hidden="true">
          <div class="panel-title-row sticky">
            <div>
              <h3>정답 및 채점</h3>
              <p class="helper">각 목차와 줄글을 각각 O/X로 채점하세요.</p>
            </div>
            <button id="closeAnswerBtn" class="icon-button" type="button" aria-label="정답 닫기">닫기</button>
          </div>

          <div id="gradingList" class="grading-list"></div>

          <div class="grading-footer">
            <p id="gradingStatus" class="grading-status">모든 항목을 채점하면 완료할 수 있습니다.</p>
            <button id="completeBtn" class="primary-button large" type="button" disabled>채점 완료</button>
          </div>
        </aside>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card result-card">
        <h2>채점 완료</h2>
        <div id="resultSummary" class="result-summary"></div>
        <p id="saveMessage" class="save-message" aria-live="polite"></p>
        <div class="result-actions">
          <button id="nextBtn" class="primary-button large" type="button">다음 논점</button>
          <button id="backSettingsBtn" class="secondary-button large" type="button">설정으로</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
